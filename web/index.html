<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0D0D1A" />
    <meta
      name="description"
      content="Munolink is a marketplace for buying and selling products and services from sellers near you."
    />

    <meta property="og:title" content="Munolink" />
    <meta
      property="og:description"
      content="Munolink is a marketplace for buying and selling products and services from sellers near you."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://munolink.com" />

    <title>Munolink</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #0d0d1a;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
      }
      #root {
        display: flex;
        min-height: 100vh;
      }
      #root > * {
        flex: 1;
      }

      /* SEO fallback — visible to Google's crawler on first paint,
         replaced by the React app once JS boots. */
      #seo-fallback {
        padding: 40px 24px;
        max-width: 800px;
        margin: 0 auto;
        line-height: 1.6;
      }
      #seo-fallback h1 {
        font-size: 32px;
        margin: 0 0 12px 0;
        color: #ffffff;
      }
      #seo-fallback p {
        font-size: 15px;
        color: #b0b0c0;
        margin: 8px 0;
      }
      #seo-fallback a {
        color: #4a7dff;
        text-decoration: none;
        margin-right: 16px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!--
        Static HTML served to crawlers on first paint.
        React Native Web mounts into #root and replaces this content.
      -->
      <div id="seo-fallback">
        <h1>Munolink</h1>
        <p>
          Munolink is a marketplace for buying and selling products and
          services from sellers near you. Discover opportunities, connect
          with sellers in your area, and grow your business on Munolink.
        </p>
        <p>
          <a href="/privacy">Privacy Policy</a>
          <a href="/terms">Terms of Service</a>
        </p>
      </div>
    </div>
  </body>
</html>
