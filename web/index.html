<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0D0D1A" />
    <meta
      name="description"
      content="Munolink is a marketplace for buying and selling products and services from sellers near you."
    />

    <meta property="og:title" content="Munolink" />
    <meta
      property="og:description"
      content="Munolink is a marketplace for buying and selling products and services from sellers near you."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.munolink.com" />

    <title>Munolink</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Munolink",
        "url": "https://www.munolink.com",
        "logo": "https://www.munolink.com/assets/favicon.png",
        "description": "Munolink is a marketplace for buying and selling products and services from sellers near you.",
        "sameAs": [
          "https://www.facebook.com/munolink",
          "https://www.instagram.com/munolink",
          "https://twitter.com/munolink"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "support@munolink.com",
          "contactType": "customer support"
        }
      }
    </script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #0d0d1a;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        height: 100%;
      }
      #root {
        display: flex;
        min-height: 100vh;
      }
      #root > * {
        flex: 1;
      }

      #splash-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0d0d1a;
        z-index: 1;
      }

      #splash-loader img {
        width: 76px;
        height: 76px;
        animation: munolink-pulse 2s ease-in-out infinite;
      }

      @keyframes munolink-pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 0.9;
        }
        50% {
          transform: scale(1.05);
          opacity: 1;
        }
      }

      #seo-fallback {
        position: absolute;
        left: -9999px;
        top: -9999px;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- SEO content for Google (off-screen) -->
      <div id="seo-fallback">
        <h1>Munolink</h1>
        <p>
          Munolink is a marketplace for buying and selling products and
          services from sellers near you. Discover opportunities, connect
          with sellers in your area, and grow your business on Munolink.
        </p>
        <p>
          <a href="/privacy">Privacy Policy</a>
          <a href="/terms">Terms of Service</a>
        </p>
      </div>

      <!-- Splash shown until React Native Web mounts -->
      <div id="splash-loader">
        <img src="/favicon.ico" alt="Munolink" />
      </div>
    </div>
  </body>
</html>
